server {
    listen 80;
    server_name localhost;

    # Resolver for Docker's internal DNS (required when using variables in proxy_pass)
    resolver 127.0.0.11 valid=30s;

    # Allow OAuth popup flow (Google) without COOP window.close blocking warnings.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Using a variable forces DNS resolution at runtime, preventing crashes on startup
        set $api_upstream http://api_gateway:80;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
