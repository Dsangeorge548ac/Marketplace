limit_req_zone $binary_remote_addr zone=mylimit:10m rate=300r/s;
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=10r/s;

server {
    listen 80;

    # Allow larger payloads for multipart uploads/publication creation.
    client_max_body_size 20M;

    # Rate Limiting Global
    limit_req zone=mylimit burst=300 nodelay;
    
    # Optimization
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend (Vue App)
    location / {
        proxy_pass http://frontend-vue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User Service - Strict Auth Limits
    location /api/user_service/auth/ {
        limit_req zone=authlimit burst=40 nodelay;
        proxy_pass http://user_service:3000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User Service - General
    location /api/user_service/ {
        proxy_pass http://user_service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Publications Service (API)
    location /api/publications_service/ {
        client_max_body_size 20M;
        proxy_pass http://publications_service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Publications Service (Images/Uploads)
    location /publications_service/uploads/ {
        proxy_pass http://publications_service:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Orders Service
    location /api/orders_service/ {
        proxy_pass http://orders_service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}