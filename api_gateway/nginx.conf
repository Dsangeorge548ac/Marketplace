# 1. Contexto HTTP (Fuera del bloque server)
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=300r/s;
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    # Resolver for Docker's internal DNS (required when using variables in proxy_pass)
    resolver 127.0.0.11 valid=30s;

    client_max_body_size 20M;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    # Variable para el origen permitido
    set $cors_origin "https://fabrimine.com";

    # --- LÓGICA DE CORS REUTILIZABLE ---
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';

    add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    # Manejo global de OPTIONS (Preflight)
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # --- RUTAS ---
    # Usamos variables en proxy_pass y reescritura de URL.

    location / {
        set $frontend_upstream http://fabrimine_frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # User Service - Strict Auth Limits
    location /api/user_service/auth/ {
        limit_req zone=authlimit burst=40 nodelay;
        set $user_auth_upstream http://fabrimine_users:3000;
        rewrite ^/api/user_service/auth/(.*) /auth/$1 break;
        proxy_pass $user_auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/user_service/ {
        set $users_upstream http://fabrimine_users:3000;
        rewrite ^/api/user_service/(.*) /$1 break;
        proxy_pass $users_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/publications_service/ {
        set $pubs_api_upstream http://fabrimine_publications:3000;
        rewrite ^/api/publications_service/(.*) /$1 break;
        proxy_pass $pubs_api_upstream;
        proxy_set_header Host $host;
    }

    location /publications_service/ {
        set $pubs_upstream http://fabrimine_publications:3000;
        rewrite ^/publications_service/(.*) /$1 break;
        proxy_pass $pubs_upstream;
        proxy_set_header Host $host;
    }

    location /user_service/ {
        set $users_files_upstream http://fabrimine_users:3000;
        rewrite ^/user_service/(.*) /$1 break;
        proxy_pass $users_files_upstream;
        proxy_set_header Host $host;
    }

    location /api/orders_service/ {
        set $orders_upstream http://fabrimine_orders:3000;
        rewrite ^/api/orders_service/(.*) /$1 break;
        proxy_pass $orders_upstream;
        proxy_set_header Host $host;
    }

    # Rutas para el servicio de respaldo de base de datos.
    location /api/backup_service/ {
        set $backup_upstream http://fabrimine_backup:3000;
        rewrite ^/api/backup_service/(.*) /$1 break;
        proxy_pass $backup_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Aumenta el timeout para descargas de archivos grandes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- BCV PROXY ---
    location /bcv-api/ {
        proxy_pass https://www.bcv.org.ve/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.bcv.org.ve;
        # Sobreescribimos solo aquí porque el BCV no soporta credentials
        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    }
}