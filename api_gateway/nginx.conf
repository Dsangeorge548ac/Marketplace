# 1. Contexto HTTP (Fuera del bloque server)
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=300r/s;
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    # Variable para el origen permitido
    set $cors_origin "https://fabrimine.com";

    # --- LÓGICA DE CORS REUTILIZABLE ---
    # Usamos proxy_hide_header para asegurar que Nginx sea el UNICO que envíe el origen
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';

    add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    # Manejo global de OPTIONS (Preflight)
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # --- RUTAS ---

    location / {
        proxy_pass http://fabrimine_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/user_service/ {
        proxy_pass http://fabrimine_users:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/publications_service/ {
        proxy_pass http://fabrimine_publications:3000/;
        proxy_set_header Host $host;
    }

    location /publications_service/ {
        proxy_pass http://fabrimine_publications:3000/;
        proxy_set_header Host $host;
    }

    location /user_service/ {
        proxy_pass http://fabrimine_users:3000/;
        proxy_set_header Host $host;
    }

    location /api/orders_service/ {
        proxy_pass http://fabrimine_orders:3000/;
        proxy_set_header Host $host;
    }

    # Rutas para el servicio de respaldo de base de datos.
    # Solo debe ser accesible desde el panel de administración.
    location /api/backup_service/ {
        proxy_pass http://fabrimine_backup:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Aumenta el timeout para descargas de archivos grandes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- BCV PROXY ---
    location /bcv-api/ {
        proxy_pass https://www.bcv.org.ve/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.bcv.org.ve;
        # Sobreescribimos solo aquí porque el BCV no soporta credentials
        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    }
}